{% extends 'navigationbar.html' %}
{% block body %}
<div class="d-flex justify-content-center" style="margin-top:80px;">
  <div class="card card-ghost" style="width:420px; padding:20px;">
    <h4 class="text-primary text-center">Set New Password</h4>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="pwd1" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="pwd2" class="form-control" required>
      </div>
      <button class="btn btn-primary btn-block">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
