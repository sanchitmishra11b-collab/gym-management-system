{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gym Management{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #ff7b00;
            padding: 12px 0;
        }

        .navbar-brand,
        .nav-link {
            color: #fff !important;
            font-weight: bold;
            text-decoration: none;
        }

        .content-wrapper {
            min-height: 80vh;
            padding: 30px 0;
        }

        footer {
            text-align: center;
            padding: 12px;
            background-color: #333;
            color: #fff;
            width: 100%;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

 <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'homepage' %}">
            Gym Management
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                {% if user.is_superuser %}
                    <a class="nav-link" href="{% url 'approve_admins' %}">
                        🔐 Approval Panel
                        {% if pending_count %}
                            <span style="background:#fff;color:#ff7b00;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:4px;">
                                {{ pending_count }}
                            </span>
                        {% endif %}
                    </a>
                {% endif %}
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

</body>
</html>
