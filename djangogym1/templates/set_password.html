{% extends 'navigationbar.html' %}
{% block body %}

<div class="container mt-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
    <h3 class="text-center text-primary mb-3">Set Your Password 🔒</h3>

    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group mb-3">
        <label>New Password</label>
        <input type="password" name="pwd1" class="form-control" required>
      </div>

      <div class="form-group mb-3">
        <label>Confirm Password</label>
        <input type="password" name="pwd2" class="form-control" required>
      </div>

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success px-5">Save Password</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
