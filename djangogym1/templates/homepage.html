{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>GymOS — Gym Management System</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'DM Sans', 'Poppins', sans-serif;
        }

        /* ── VIDEO BG ── */
        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; /* ← cover not contain — fills screen properly */
            z-index: -2;
            background: #000;
        }

        /* ── OVERLAY ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.5) 0%,
                rgba(0,0,0,0.65) 50%,
                rgba(0,0,0,0.8) 100%
            );
            z-index: -1;
        }

        /* ── MAIN CONTENT ── */
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 20px 24px;
        }

        /* logo pill */
        .logo-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,107,0,.15);
            border: 1px solid rgba(255,107,0,.35);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff9500;
            margin-bottom: 24px;
            animation: fadeIn 1s ease;
        }

        /* main heading */
        h1 {
            font-size: clamp(2rem, 8vw, 4.5rem); /* scales with screen */
            font-weight: 800;
            line-height: 1.1;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            margin-bottom: 16px;
            animation: fadeInDown .9s ease;
        }
        h1 span { color: #ff6b00; }

        /* subtitle */
        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: rgba(255,255,255,0.75);
            margin-bottom: 40px;
            max-width: 480px;
            line-height: 1.6;
            animation: fadeInUp 1s ease;
        }

        /* buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1.1s ease;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            border: none;
            color: #000;
            font-size: clamp(0.9rem, 3vw, 1rem);
            font-weight: 700;
            padding: clamp(10px, 3vw, 14px) clamp(24px, 6vw, 40px);
            border-radius: 50px;
            text-decoration: none;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 20px rgba(255,107,0,.4);
            white-space: nowrap;
        }
        .btn-primary-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(255,107,0,.6);
            color: #000;
            text-decoration: none;
        }

        .btn-secondary-custom {
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.3);
            color: #fff;
            font-size: clamp(0.9rem, 3vw, 1rem);
            font-weight: 600;
            padding: clamp(10px, 3vw, 14px) clamp(24px, 6vw, 40px);
            border-radius: 50px;
            text-decoration: none;
            transition: background .2s, transform .2s;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        .btn-secondary-custom:hover {
            background: rgba(255,255,255,.2);
            transform: scale(1.05);
            color: #fff;
            text-decoration: none;
        }

        /* stats row */
        .stats-row {
            display: flex;
            gap: clamp(16px, 4vw, 40px);
            margin-top: 52px;
            animation: fadeIn 1.3s ease;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-num {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            font-weight: 800;
            color: #ff6b00;
            line-height: 1;
        }
        .stat-label {
            font-size: clamp(9px, 2vw, 11px);
            color: rgba(255,255,255,.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }
        .stat-divider {
            width: 1px;
            background: rgba(255,255,255,.15);
            align-self: stretch;
        }

        /* footer */
        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            text-align: center;
            padding: 14px 20px;
            color: rgba(255,255,255,.4);
            font-size: clamp(10px, 2.5vw, 12px);
            z-index: 1;
            background: linear-gradient(to top, rgba(0,0,0,.4), transparent);
        }

        /* animations */
        @keyframes fadeIn     { from{opacity:0} to{opacity:1} }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeInUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }

        /* ── MOBILE SPECIFIC ── */
        @media (max-width: 480px) {
            .content { padding: 16px; justify-content: center; }
            .btn-group { flex-direction: column; width: 100%; max-width: 280px; }
            .btn-primary-custom,
            .btn-secondary-custom { text-align: center; width: 100%; }
            .stats-row { gap: 12px; margin-top: 36px; }
            .stat-divider { display: none; }
        }

        /* ── TABLET ── */
        @media (min-width: 481px) and (max-width: 768px) {
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="{% static 'videos/gym_bg1.mp4' %}" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Content -->
    <div class="content">

        <div class="logo-pill">🏋️ GymOS Platform</div>

        <h1>Manage Your Gym<br><span>Like a Pro</span></h1>

        <p class="subtitle">
            Complete gym management — members, attendance, plans, equipment and revenue in one place.
        </p>

        <div class="btn-group">
            <a href="{% url 'login' %}" class="btn-primary-custom">Admin Portal</a>
            <a href="{% url 'member_login' %}" class="btn-secondary-custom">Member Login</a>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-num">∞</div>
                <div class="stat-label">Members</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-num">24/7</div>
                <div class="stat-label">Access</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-num">100%</div>
                <div class="stat-label">Uptime</div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>© 2025 GymOS · Built for gym efficiency 💪</footer>

</body>
</html>
