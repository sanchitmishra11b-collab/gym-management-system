{% extends 'navigationbar.html' %}
{% block body %}

<div class="container" style="margin-top: 90px;">
  
  <div class="card card-ghost p-4 shadow-lg" style="border-radius: 12px;">
    
    <h2 class="text-center mb-4" style="color: orange; font-weight: bold;">
      Pending Admin Approvals
    </h2>

    {% if pending %}

    <div class="table-responsive">
      <table class="table table-dark table-hover text-center align-middle">
        
        <thead style="background: #111;">
          <tr>
            <th style="color: orange;">Username</th>
            <th style="color: orange;">Action</th>
          </tr>
        </thead>

        <tbody>
          {% for user in pending %}
          <tr>
            <td style="font-size: 18px;">{{ user.username }}</td>

            <td>
              <a href="{% url 'approve_user' user.id %}" 
                 class="btn btn-success btn-sm px-3">
                 ✅ Approve
              </a>

              <a href="#" 
                 class="btn btn-danger btn-sm px-3">
                 ❌ Reject
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>

    {% else %}

      <div class="text-center mt-4">
        <h4 style="color: lightgreen;">🎉 No pending admins</h4>
        <p style="color: gray;">All admins are approved</p>
      </div>

    {% endif %}

  </div>

</div>

{% endblock %}
