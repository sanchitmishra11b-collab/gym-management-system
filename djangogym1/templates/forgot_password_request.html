{% extends 'navigationbar.html' %}
{% block body %}
<div class="d-flex justify-content-center" style="margin-top:80px;">
  <div class="card card-ghost" style="width:420px; padding:22px;">
    <h3 class="text-primary text-center mb-2">Forgot Password</h3>
    <p class="text-center text-muted">Enter your admin username to receive a one-time code by email.</p>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" name="uname" class="form-control" required>
      </div>
      <button class="btn btn-primary btn-block">Send OTP to Email</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'login' %}">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
