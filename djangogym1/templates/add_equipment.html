{% extends 'navigationbar.html' %}

{% block body %}


<div class="container" style="margin-top:60px">
    <h2 class="text-center text-primary font-weight-bold">Add Equipments</h2>
    <form method="post">
        {% csrf_token %}

        <label><b>Equipment Name</b></label>
        <input type="text"  name="name" class="form-control" required>

        <label><b>Price(In Rs.)</b></label>
        <input type="text"  name="price" class="form-control"required>

         <label><b>Unit</b></label>
        <input type="text"  name="unit" class="form-control"required>

         <label><b>Purchase Date</b></label>
        <input type="date"  name="date" class="form-control"required>

         <label><b>Description</b></label>

        <textarea class="form-control" name="description"></textarea>
         <br>
        <input type= submit value="Submit" class="form-control btn-primary">
    </form>
</div>
{% if error == "no" %}
<script>
    alert('✅ Record saved successfully');
    window.location = "{% url "view_equipment" %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert('❌ Something went wrong, Try Again');
</script>
{% endif %}

{% endblock %}
